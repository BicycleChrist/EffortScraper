            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: ticker 300s linear infinite;

        .ticker__item {
            display: inline-block;
            padding: 0 2rem;
        }
        @keyframes ticker {

        function populateTicker() {
            const ticker = document.getElementById('ticker');
            let tickerContent = '';

            tickerData.forEach(item => {
                if ('democratic' in item) {
                    tickerContent += `<div class="ticker__item"><strong>${item.title}</strong>: Democratic: ${item.democratic}% Republican: ${item.republican}%</div>`;
                } else {
                    tickerContent += `<div class="ticker__item"><strong>${item.title}</strong>: Yes: ${item.yes}% No: ${item.no}%</div>`;
                }
            });

            // Duplicate the content to ensure seamless looping
            ticker.innerHTML = tickerContent + tickerContent;
        }

        function adjustAnimationDuration() {
            const ticker = document.getElementById('ticker');
            const contentWidth = ticker.scrollWidth / 2; // Divide by 2 because we duplicated the content
            const duration = contentWidth / 150; // Adjust 50 to change scroll speed
            ticker.style.animationDuration = `${duration}s`;
        }

        window.addEventListener('load', () => {
            populateTicker();
            adjustAnimationDuration();
        });
        window.addEventListener('resize', adjustAnimationDuration);
